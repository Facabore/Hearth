name: hearth-dev

x-node: &node
  image: node:24.21.0-alpine
  working_dir: /workspace
  environment: &node-env
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    DATABASE_URL: postgres://hearth:hearth@db:5432/hearth
  volumes:
    - .:/workspace
    - node-modules:/workspace/node_modules

x-postgres: &postgres
  image: postgres:18.6-alpine
  environment:
    POSTGRES_DB: hearth
    POSTGRES_USER: hearth
    POSTGRES_PASSWORD: hearth
  healthcheck:
    # TCP probe: the init-time temporary server listens only on the unix socket
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U hearth -d hearth"]
    interval: 2s
    timeout: 3s
    retries: 30

services:
  db:
    <<: *postgres
    ports: ["127.0.0.1:${HEARTH_DB_PORT:-5432}:5432"] # host port overridable when 5432 is taken
    volumes: [db-data:/var/lib/postgresql]

  deps:
    <<: *node
    command: sh -c "corepack enable && pnpm install --frozen-lockfile"

  migrate:
    <<: *node
    command: sh -c "corepack enable && pnpm db:migrate"
    depends_on:
      db: { condition: service_healthy }
      deps: { condition: service_completed_successfully }

  app:
    <<: *node
    # webpack + polling: Turbopack misses file events from Windows bind mounts
    command: sh -c "corepack enable && pnpm dev --webpack --hostname 0.0.0.0"
    environment:
      <<: *node-env
      BETTER_AUTH_SECRET: dev-only-secret-0123456789abcdef0123
      BETTER_AUTH_URL: http://localhost:3000
      WATCHPACK_POLLING: "true"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - .:/workspace
      - node-modules:/workspace/node_modules
      - next-cache:/workspace/.next
    depends_on:
      migrate: { condition: service_completed_successfully }

  # `docker compose -f compose.dev.yaml --profile test run --rm test`
  test-db:
    <<: *postgres
    profiles: [test]
    tmpfs: [/var/lib/postgresql]

  test:
    <<: *node
    profiles: [test]
    command: sh -c "corepack enable && pnpm test"
    environment:
      <<: *node-env
      TEST_DATABASE_URL: postgres://hearth:hearth@test-db:5432/hearth
    depends_on:
      test-db: { condition: service_healthy }
      deps: { condition: service_completed_successfully }

volumes:
  db-data: {}
  node-modules: {}
  next-cache: {}
