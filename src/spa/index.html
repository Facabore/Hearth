<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f4ef" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121614" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <title>Hearth</title>
  </head>
  <body class="min-h-dvh antialiased">
    <div id="root">
      <!--
        ADR 0004 (amended 2026-10-28): what the page paints before the app's script runs, the app's frame (AppShell's
        header and bottom bar) or a visitor's (PublicLayout's), as FRAME_PICK marks it. React replaces both.
      -->
      <div
        class="hearth-frame-app min-h-dvh pb-[calc(76px+env(safe-area-inset-bottom))] lg:pb-0 lg:pl-[240px]"
      >
        <div class="mx-auto max-w-[1200px] px-4 max-[359px]:px-3">
          <header class="flex h-12 items-center justify-between">
            <span class="inline-flex items-center gap-2 text-lg font-semibold text-ink"
              ><svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
                <path
                  d="M5 13 14 5.5 23 13v10H5V13Z"
                  stroke="var(--accent)"
                  stroke-width="1.75"
                  stroke-linejoin="round"
                />
                <path
                  d="M14 21c-2.2 0-3.6-1.6-3.6-3.6 0-2.6 3.6-5 3.6-6.6 0 1.6 3.6 4 3.6 6.6 0 2-1.4 3.6-3.6 3.6Z"
                  stroke="var(--owe)"
                  stroke-width="1.75"
                  stroke-linejoin="round"
                /></svg
              >Hearth</span
            >
          </header>
        </div>
        <div
          class="fixed inset-x-0 bottom-0 z-10 h-[calc(76px+env(safe-area-inset-bottom))] border-t border-line bg-surface lg:inset-y-0 lg:right-auto lg:h-auto lg:w-[240px] lg:border-t-0 lg:border-r"
        ></div>
      </div>
      <div class="hearth-frame-public mx-auto max-w-[420px] px-4 pt-3 pb-4 max-[359px]:px-3">
        <div class="mb-8 flex items-center justify-between">
          <span class="inline-flex items-center gap-2 text-lg font-semibold text-ink"
            ><svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
              <path
                d="M5 13 14 5.5 23 13v10H5V13Z"
                stroke="var(--accent)"
                stroke-width="1.75"
                stroke-linejoin="round"
              />
              <path
                d="M14 21c-2.2 0-3.6-1.6-3.6-3.6 0-2.6 3.6-5 3.6-6.6 0 1.6 3.6 4 3.6 6.6 0 2-1.4 3.6-3.6 3.6Z"
                stroke="var(--owe)"
                stroke-width="1.75"
                stroke-linejoin="round"
              /></svg
            >Hearth</span
          >
        </div>
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
