name: hearth

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hearth
      POSTGRES_USER: hearth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes: [db-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U hearth -d hearth"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  migrate:
    image: ${HEARTH_MIGRATOR_IMAGE:?HEARTH_MIGRATOR_IMAGE is required}
    environment:
      DATABASE_URL: postgres://hearth:${POSTGRES_PASSWORD}@db:5432/hearth
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    networks: [internal]

  app:
    image: ${HEARTH_APP_IMAGE:?HEARTH_APP_IMAGE is required}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://hearth:${POSTGRES_PASSWORD}@db:5432/hearth
      # No ":?" guard on purpose: the app itself must refuse to start and name the variable (HU-E0-07).
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: https://${HEARTH_DOMAIN}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Bogota}
      RECURRENCE_JOB_INTERVAL_SECONDS: ${RECURRENCE_JOB_INTERVAL_SECONDS:-300}
      # Ruling P143: "closed" makes sign-up invite-only (docs/operations/deploy.md, Closing sign-up).
      HEARTH_SIGN_UP: ${HEARTH_SIGN_UP:-open}
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [internal]

  # ADR 0006 (#199): the single-page app's static files, which Caddy serves at /app/ (the image's Caddyfile.web).
  web:
    image: ${HEARTH_WEB_IMAGE:?HEARTH_WEB_IMAGE is required}
    restart: unless-stopped
    networks: [internal]

  # Nightly pg_dump at 02:00 in APP_TIMEZONE into the backups volume (HU-E8-01, docs/operations/backups.md).
  backup:
    image: postgres:18.6-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/hearth/cron-entrypoint.sh"]
    command: ["0 2 * * *", "sh /hearth/backup.sh"]
    environment:
      TZ: ${APP_TIMEZONE:-America/Bogota}
      PGHOST: db
      PGUSER: hearth
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: hearth
      PGCONNECT_TIMEOUT: "10"
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    # The image declares a volume for PostgreSQL's data; a tmpfs there leaves no anonymous volume behind.
    tmpfs: [/var/lib/postgresql]
    volumes:
      - backups:/backups
      # The whole directory: a missing scripts/ fails loudly instead of mounting an empty directory per script.
      - ./scripts:/hearth:ro
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]

  # Optional off-site copy of the backups (HU-E8-01): runs only with COMPOSE_PROFILES=offsite in .env.
  backup-offsite:
    image: rclone/rclone:1.75.2
    profiles: [offsite]
    restart: unless-stopped
    entrypoint: ["sh", "/hearth/cron-entrypoint.sh"]
    command: ["0 3 * * *", "sh /hearth/offsite-copy.sh"]
    environment:
      TZ: ${APP_TIMEZONE:-America/Bogota}
      BACKUP_DIR: /backups
    # BACKUP_OFFSITE_REMOTE and the RCLONE_CONFIG_OFFSITE_* variables of the remote (.env.offsite.example).
    env_file:
      - path: .env.offsite
        required: false
    volumes:
      - backups:/backups:ro
      # The whole directory, like the backup service (P116): a missing scripts/ fails loudly.
      - ./scripts:/hearth:ro
    # Its own network: it reaches the internet, never the database.
    networks: [offsite]

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      HEARTH_DOMAIN: ${HEARTH_DOMAIN:?HEARTH_DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app: { condition: service_healthy }
      # Started, not healthy: a broken SPA image must never keep the API and the Next.js UI offline.
      web: { condition: service_started }
    networks: [internal]

networks:
  internal: {}
  offsite: {}

volumes:
  db-data: {}
  backups: {}
  caddy-data: {}
  caddy-config: {}
