name: hearth

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hearth
      POSTGRES_USER: hearth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes: [db-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U hearth -d hearth"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  migrate:
    image: ${HEARTH_MIGRATOR_IMAGE:?HEARTH_MIGRATOR_IMAGE is required}
    environment:
      DATABASE_URL: postgres://hearth:${POSTGRES_PASSWORD}@db:5432/hearth
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    networks: [internal]

  app:
    image: ${HEARTH_APP_IMAGE:?HEARTH_APP_IMAGE is required}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://hearth:${POSTGRES_PASSWORD}@db:5432/hearth
      # No ":?" guard on purpose: the app itself must refuse to start and name the variable (HU-E0-07).
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: https://${HEARTH_DOMAIN}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Bogota}
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [internal]

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      HEARTH_DOMAIN: ${HEARTH_DOMAIN:?HEARTH_DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app: { condition: service_healthy }
    networks: [internal]

networks:
  internal: {}

volumes:
  db-data: {}
  caddy-data: {}
  caddy-config: {}
