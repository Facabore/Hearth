name: hearth

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hearth
      POSTGRES_USER: hearth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes: [db-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U hearth -d hearth"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  migrate:
    image: ${HEARTH_MIGRATOR_IMAGE:?HEARTH_MIGRATOR_IMAGE is required}
    environment:
      DATABASE_URL: postgres://hearth:${POSTGRES_PASSWORD}@db:5432/hearth
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    networks: [internal]

  app:
    image: ${HEARTH_APP_IMAGE:?HEARTH_APP_IMAGE is required}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://hearth:${POSTGRES_PASSWORD}@db:5432/hearth
      # No ":?" guard on purpose: the app itself must refuse to start and name the variable (HU-E0-07).
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: https://${HEARTH_DOMAIN}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Bogota}
      RECURRENCE_JOB_INTERVAL_SECONDS: ${RECURRENCE_JOB_INTERVAL_SECONDS:-300}
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [internal]

  # Nightly pg_dump at 02:00 in APP_TIMEZONE into the backups volume (HU-E8-01, docs/operations/backups.md).
  backup:
    image: postgres:18.6-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/hearth/cron-entrypoint.sh"]
    command: ["0 2 * * *", "sh /hearth/backup.sh"]
    environment:
      TZ: ${APP_TIMEZONE:-America/Bogota}
      PGHOST: db
      PGUSER: hearth
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: hearth
      PGCONNECT_TIMEOUT: "10"
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    # The image declares a volume for PostgreSQL's data; a tmpfs there leaves no anonymous volume behind.
    tmpfs: [/var/lib/postgresql]
    volumes:
      - backups:/backups
      # The whole directory: a missing scripts/ fails loudly instead of mounting an empty directory per script.
      - ./scripts:/hearth:ro
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      HEARTH_DOMAIN: ${HEARTH_DOMAIN:?HEARTH_DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app: { condition: service_healthy }
    networks: [internal]

networks:
  internal: {}

volumes:
  db-data: {}
  backups: {}
  caddy-data: {}
  caddy-config: {}
