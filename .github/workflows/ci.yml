name: CI

on:
  pull_request:
  push:
    branches: [main, development]
  # Runs the performance gates on demand (Actions > CI > Run workflow), on any branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main run: it may be halfway through publishing images.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Actions are pinned to commit SHAs (tag in the comment), like every other dependency.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:pinned
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm db:check
      - run: pnpm api:check
      - run: pnpm i18n:check

  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:boundaries

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Unit, integration, acceptance and operations tests (disposable containers through the Docker CLI)
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm spa:build
      - name: The single-page app's chunk budgets (ADR 0006)
        run: pnpm spa:budget
      - name: End-to-end scenarios (the SPA at the root, the standalone API server, PostgreSQL through the Docker CLI)
        run: pnpm test:e2e

  # The slowest gate (Lighthouse five times per route, INP): it validates a release, not every push (ADR 0004,
  # amended 2026-10-28). It runs on main and on demand; pull requests and development skip it.
  performance:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      # Playwright starts the SPA's preview with the e2e server, so the build must exist.
      - run: pnpm spa:build
      - name: Core Web Vitals and script budgets (Lighthouse mobile, INP with web-vitals)
        run: pnpm perf

  build-image:
    needs: [lint, boundaries, typecheck, test, e2e, performance]
    # A skipped performance job (outside main) must not skip the image; a failed one still blocks it.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      APP_IMAGE: ghcr.io/facabore/hearth
      MIGRATOR_IMAGE: ghcr.io/facabore/hearth-migrator
      WEB_IMAGE: ghcr.io/facabore/hearth-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          load: true
          tags: ${{ env.APP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build migrator image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: migrator
          load: true
          tags: ${{ env.MIGRATOR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          load: true
          tags: ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
      - name: Smoke test the web image (ADR 0006)
        run: |
          docker run -d --name web -p 8080:8080 "$WEB_IMAGE:${{ github.sha }}"
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:8080/ && break; sleep 1; done
          # A screen's path is the app's page; an asset or an icon is served as itself; a missing file is a 404 (N1).
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/spaces/x/transactions | grep -q '<div id="root">'
          asset=$(curl -fsS http://localhost:8080/ | grep -o '/assets/index-[^"]*\.js' | head -n1)
          curl -fsS -o /dev/null "http://localhost:8080$asset"
          curl -fsS -o /dev/null http://localhost:8080/icon.svg
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/assets/missing.js)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/missing.png)" = 404
          # The app's first address, /app/…, lands on the same screen at the root.
          test "$(curl -s -o /dev/null -w '%{redirect_url}' http://localhost:8080/app)" = "http://localhost:8080/"
          test "$(curl -s -o /dev/null -w '%{redirect_url}' 'http://localhost:8080/app/spaces/x?tx=1')" = "http://localhost:8080/spaces/x?tx=1"
          # Never to another host: leading slashes after the prefix collapse to one.
          test "$(curl -s -o /dev/null --path-as-is -w '%header{location}' 'http://localhost:8080/app//evil.example/x')" = "/evil.example/x"
      - name: Smoke test the images against PostgreSQL
        run: |
          docker network create smoke
          docker run -d --name db --network smoke -e POSTGRES_DB=hearth -e POSTGRES_USER=hearth -e POSTGRES_PASSWORD=hearth postgres:18.6-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -h 127.0.0.1 -U hearth -d hearth && break; sleep 1; done
          docker exec db pg_isready -h 127.0.0.1 -U hearth -d hearth
          docker run --rm --network smoke -e DATABASE_URL=postgres://hearth:hearth@db:5432/hearth "$MIGRATOR_IMAGE:${{ github.sha }}"
          docker run -d --name app --network smoke -p 3000:3000 \
            -e DATABASE_URL=postgres://hearth:hearth@db:5432/hearth \
            -e BETTER_AUTH_SECRET=ci-smoke-secret-0123456789abcdef0123 \
            -e BETTER_AUTH_URL=http://localhost:3000 \
            "$APP_IMAGE:${{ github.sha }}"
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/v1/health && break; sleep 1; done
          curl -fsS http://localhost:3000/api/v1/health
          curl -fsS http://localhost:3000/api/v1/openapi.json | grep -q '"openapi":"3.1.0"'
      - name: App logs
        if: always()
        run: docker logs app || true; docker logs web || true
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push images tagged with the commit SHA and main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for image in "$APP_IMAGE" "$MIGRATOR_IMAGE" "$WEB_IMAGE"; do
            docker tag "$image:${{ github.sha }}" "$image:main"
            docker push "$image:${{ github.sha }}"
            docker push "$image:main"
          done
